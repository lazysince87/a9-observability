name: Verify observability with Docker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.js'
      - 'tracing*.js'
      - 'package*.json'
      - 'docker-compose.yml'
      - 'scripts/**'
      - '.github/workflows/observability.yml'

permissions:
  contents: write

jobs:
  docker-exercise:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Start MongoDB and Jaeger in Docker
        run: docker compose --project-name a9-observability up -d --wait
      - name: Install browser for evidence screenshots
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run both tracing stages and capture Jaeger evidence
        run: node scripts/verify-docker.js
      - name: Save evidence as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observability-docker-evidence
          path: evidence/ci/
          retention-days: 30
      - name: Commit verified evidence
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const {owner, repo} = context.repo;
            const branch = context.payload.repository.default_branch;
            const ref = await github.rest.git.getRef({owner, repo, ref: `heads/${branch}`});
            const parent = await github.rest.git.getCommit({owner, repo, commit_sha: ref.data.object.sha});
            const tree = [];
            for (const name of fs.readdirSync('evidence/ci').sort()) {
              const local = path.join('evidence/ci', name);
              if (!fs.statSync(local).isFile()) continue;
              const blob = await github.rest.git.createBlob({owner, repo, content: fs.readFileSync(local).toString('base64'), encoding: 'base64'});
              tree.push({path: local, mode: '100644', type: 'blob', sha: blob.data.sha});
            }
            const createdTree = await github.rest.git.createTree({owner, repo, base_tree: parent.data.tree.sha, tree});
            const commit = await github.rest.git.createCommit({owner, repo, message: 'Save verified Docker tracing evidence', tree: createdTree.data.sha, parents: [parent.data.sha]});
            await github.rest.git.updateRef({owner, repo, ref: `heads/${branch}`, sha: commit.data.sha, force: false});
      - name: Stop containers
        if: always()
        run: docker compose --project-name a9-observability down
